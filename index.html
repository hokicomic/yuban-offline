<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語伴・離線學習版</title><style>
:root{--ink:#19212d;--muted:#64748b;--line:#dce3ec;--bg:#f5f7fb;--brand:#2563eb;--panel:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.app{max-width:1200px;margin:auto;padding:20px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top h1{font-size:22px;margin:0}.tag{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px #1e293b0c}.toolbar,.controls{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,label.file{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font:inherit;cursor:pointer}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}label.file input{display:none}select,input,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:16px;margin-top:16px}.player{position:relative;background:#101827;min-height:260px;border-radius:14px;overflow:hidden}.player video,.player audio{width:100%;max-height:62vh;display:block}.mask video{filter:brightness(0)}.caption{position:absolute;bottom:14px;left:5%;right:5%;padding:10px 14px;border-radius:10px;background:#000b;color:#fff;text-align:center;font-size:clamp(18px,2.2vw,29px);line-height:1.45;text-shadow:0 2px 4px #000}.caption.hidden{display:none}.status{padding:10px 14px;color:var(--muted);font-size:14px}.subtitle-list{max-height:58vh;overflow:auto}.sub{padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;line-height:1.5}.sub:hover,.sub.active{background:#eff6ff}.sub small{display:block;color:var(--muted);margin-bottom:3px}.note{padding:12px;border-top:1px solid var(--line)}.note textarea{width:100%;min-height:74px;resize:vertical}.flash{padding:12px;border-top:1px solid var(--line)}.flash-card{min-height:112px;padding:18px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;cursor:pointer;line-height:1.55}.flash-actions{display:flex;justify-content:space-between;margin-top:8px}.empty{padding:22px;color:var(--muted);text-align:center}@media(max-width:760px){.app{padding:12px}main{grid-template-columns:1fr}.player{min-height:190px}.subtitle-list{max-height:35vh}}
</style></head><body><div class="app"><header class="top"><div><h1>語伴・離線學習版</h1><div class="tag">本機檔案、字幕、跟讀與字卡；不含 Gemini／AI bridge。</div></div><div class="tag" id="status">尚未載入媒體</div></header>
<section class="card toolbar"><label class="file">載入影音<input id="mediaFile" type="file" accept="audio/*,video/*" multiple></label><label class="file">載入字幕<input id="subFile" type="file" accept=".srt,.vtt,.lrc,text/plain"></label><label class="file">載入字卡 JSON<input id="cardFile" type="file" accept="application/json,.json"></label><button id="exportCards">匯出字卡</button><button id="clearAll">清除本機資料</button></section>
<main><section class="card"><div class="player" id="playerWrap"><video id="media" controls playsinline></video><div id="caption" class="caption hidden"></div></div><div class="controls"><button id="prev">上一句</button><button class="primary" id="replay">重播本句</button><button id="next">下一句</button><button id="loop">單句循環：關</button><button id="shadow">跟讀：關</button><button id="mask">遮罩影片</button><button id="hideCaption">隱藏字幕</button><button id="speak">瀏覽器朗讀</button><label>語速 <select id="rate"><option>.6</option><option>.8</option><option selected>1</option><option>1.2</option><option>1.5</option><option>2</option></select></label></div><div class="status" id="detail">載入影音與字幕後，點選句子即可跳轉；單句循環與跟讀會自動依字幕時間停留。</div><div class="subtitle-list" id="subs"><div class="empty">尚未載入字幕</div></div></section>
<aside class="card"><section class="note"><strong>本句筆記</strong><textarea id="note" placeholder="可手動填入翻譯、用法或提醒；儲存在本機瀏覽器。"></textarea><div class="controls"><button id="saveNote">儲存筆記</button><button id="addCard">加入字卡</button></div></section><section class="flash"><strong>本機字卡</strong><div class="tag" id="cardCount"></div><div class="flash-card" id="flashCard">尚未建立字卡</div><div class="flash-actions"><button id="cardPrev">上一張</button><button id="cardFlip">翻面</button><button id="cardNext">下一張</button></div></section><section class="note"><strong>功能範圍</strong><p class="tag">保留：本機影音／字幕、逐句定位、循環、跟讀、語速、遮罩、系統朗讀、手動筆記與字卡。</p><p class="tag">移除：Gemini Canvas bridge、API 金鑰、AI 解析／翻譯／測驗、Live 與 AI 發音評測。</p></section></aside></main></div>
<script>
const media=document.querySelector('#media'),subsEl=document.querySelector('#subs'),caption=document.querySelector('#caption'),status=document.querySelector('#status'),detail=document.querySelector('#detail');let subs=[],idx=-1,loop=false,shadow=false,waitTimer=0,cards=JSON.parse(localStorage.yubanOfflineCards||'[]'),cardIdx=0,flipped=false;
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function parseTime(x){let p=x.trim().replace(',','.').split(':').map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]}
function parseSubs(text){let blocks=text.replace(/^WEBVTT[^\n]*\n/i,'').trim().split(/\n\s*\n/),out=[];blocks.forEach(b=>{let l=b.split(/\r?\n/).filter(Boolean),i=l.findIndex(x=>x.includes('-->'));if(i<0)return;let [a,z]=l[i].split('-->').map(x=>x.trim().split(/\s+/)[0]);out.push({start:parseTime(a),end:parseTime(z),text:l.slice(i+1).join(' ').replace(/<[^>]+>/g,'').trim()})});return out.filter(x=>x.text)}
function renderSubs(){subsEl.innerHTML=subs.length?subs.map((s,i)=>`<div class="sub ${i===idx?'active':''}" data-i="${i}"><small>${fmt(s.start)} – ${fmt(s.end)}</small>${esc(s.text)}</div>`).join(''):'<div class="empty">尚未載入字幕</div>';subsEl.querySelectorAll('.sub').forEach(e=>e.onclick=()=>go(+e.dataset.i));}
function go(i,play=true){if(!subs.length)return;idx=Math.max(0,Math.min(i,subs.length-1));let s=subs[idx];media.currentTime=s.start+.02;caption.textContent=s.text;caption.classList.remove('hidden');document.querySelector('#note').value=localStorage.getItem('yubanNote:'+s.text)||'';renderSubs();subsEl.querySelector('.active')?.scrollIntoView({block:'nearest'});detail.textContent=`第 ${idx+1}/${subs.length} 句・${fmt(s.start)} – ${fmt(s.end)}${loop?'・單句循環':''}${shadow?'・跟讀':''}`;if(play)media.play();}
function current(){return subs[idx]||null}function tick(){let i=subs.findIndex(s=>media.currentTime>=s.start&&media.currentTime<s.end);if(i!==-1&&i!==idx)go(i,false);let s=current();if(!s||media.currentTime<s.end)return;if(loop){media.currentTime=s.start;media.play()}else if(shadow){media.pause();clearTimeout(waitTimer);waitTimer=setTimeout(()=>{media.currentTime=s.start;media.play()},1300)}else if(idx<subs.length-1)go(idx+1,true)}
media.addEventListener('timeupdate',tick);media.addEventListener('ended',()=>{if(idx<subs.length-1)go(idx+1)});
document.querySelector('#mediaFile').onchange=e=>{let files=[...e.target.files];if(!files.length)return;let f=files[0];media.src=URL.createObjectURL(f);media.load();status.textContent=`已載入：${f.name}${files.length>1?'（已選取多檔，現播放第一檔）':''}`};document.querySelector('#subFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;subs=parseSubs(await f.text());idx=-1;renderSubs();status.textContent=`已載入 ${subs.length} 句字幕：${f.name}`;if(subs.length)go(0,false)};
document.querySelector('#prev').onclick=()=>go(idx-1);document.querySelector('#next').onclick=()=>go(idx+1);document.querySelector('#replay').onclick=()=>go(idx);document.querySelector('#loop').onclick=e=>{loop=!loop;e.target.textContent=`單句循環：${loop?'開':'關'}`};document.querySelector('#shadow').onclick=e=>{shadow=!shadow;e.target.textContent=`跟讀：${shadow?'開':'關'}`};document.querySelector('#mask').onclick=e=>{document.querySelector('#playerWrap').classList.toggle('mask');e.target.textContent=document.querySelector('#playerWrap').classList.contains('mask')?'顯示影片':'遮罩影片'};document.querySelector('#hideCaption').onclick=e=>{caption.classList.toggle('hidden');e.target.textContent=caption.classList.contains('hidden')?'顯示字幕':'隱藏字幕'};document.querySelector('#rate').onchange=e=>media.playbackRate=+e.target.value;document.querySelector('#speak').onclick=()=>{let s=current();if(!s)return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(s.text))};document.querySelector('#saveNote').onclick=()=>{let s=current();if(s)localStorage.setItem('yubanNote:'+s.text,document.querySelector('#note').value)};
function renderCard(){let c=cards[cardIdx];document.querySelector('#cardCount').textContent=`${cards.length?`${cardIdx+1}/${cards.length}`:'0 張'}`;document.querySelector('#flashCard').textContent=c?(flipped?(c.back||'（尚未填筆記）'):c.front):'尚未建立字卡'}function saveCards(){localStorage.yubanOfflineCards=JSON.stringify(cards);renderCard()}document.querySelector('#addCard').onclick=()=>{let s=current();if(!s)return;cards.push({front:s.text,back:document.querySelector('#note').value});cardIdx=cards.length-1;flipped=false;saveCards()};document.querySelector('#flashCard').onclick=()=>{if(cards.length){flipped=!flipped;renderCard()}};document.querySelector('#cardFlip').onclick=()=>{flipped=!flipped;renderCard()};document.querySelector('#cardPrev').onclick=()=>{if(cards.length){cardIdx=(cardIdx-1+cards.length)%cards.length;flipped=false;renderCard()}};document.querySelector('#cardNext').onclick=()=>{if(cards.length){cardIdx=(cardIdx+1)%cards.length;flipped=false;renderCard()}};document.querySelector('#cardFile').onchange=async e=>{try{cards=JSON.parse(await e.target.files[0].text());cardIdx=0;flipped=false;saveCards()}catch{alert('字卡 JSON 格式無法讀取')}};document.querySelector('#exportCards').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}));a.download='yuban-flashcards.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#clearAll').onclick=()=>{if(confirm('清除本機筆記與字卡？')){localStorage.removeItem('yubanOfflineCards');cards=[];renderCard()}};renderCard();
</script></body></html>
